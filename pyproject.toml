[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shopsage-rec"
version = "0.1.0"
description = "Two-Tower retriever + LightGBM ranker on MovieLens-20M: hard-negative mining, BM25/hybrid baselines, LLM query expansion, Streamlit demo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Yi Zhao" }]
keywords = ["recommender-systems", "two-tower", "faiss", "lightgbm", "movielens", "polars", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core = everything the data pipeline and CLI need. Deliberately light so the demo stays
# within Streamlit Community Cloud's 690 MB guaranteed RAM (2.7 GB max) without torch.
dependencies = [
  "polars>=2.0,<3.0",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "numpy>=2.0",
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Model training + offline evaluation (run on a cloud GPU box or on the laptop via MPS; see
# docs/design.md "Compute"). FAISS is NOT here: pick exactly one of the `cpu` / `gpu` extras.
# torch>=2.6 is the release where torch.load defaults to weights_only=True.
train = [
  "torch>=2.6",
  "wandb>=0.17",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "sentence-transformers>=5.0",
  "rank-bm25>=0.2.2",
  "tqdm>=4.66",
]
# The two FAISS builds install the same top-level `faiss/` package, so they are declared as
# conflicting extras below ([tool.uv] conflicts). `faiss-gpu` is Meta's official CUDA 12.6 wheel
# (Linux x86_64 only, sm_70..sm_90). bitsandbytes is deliberately absent: the model is ~78 MB of
# embeddings and never needs quantisation.
cpu = ["faiss-cpu>=1.15,<1.16"]
gpu = ["faiss-gpu>=1.15,<1.16; sys_platform == 'linux' and platform_machine == 'x86_64'"]
# LLM query expansion via the Claude API (anthropic 1.x is a breaking major: httpx2, no sampling
# overrides on current models). Qwen2.5-0.5B via vLLM is documented as a separate venv/container
# because vllm pins exact torch/transformers versions that would break this lock.
llm = ["anthropic>=1.0,<2"]
# Streamlit demo: CPU-only inference over precomputed artifacts; never imports torch. On Streamlit
# Community Cloud the dependency file next to the app (generated with `uv export --extra demo`)
# takes precedence over the root uv.lock; the root requirements.txt serves the Dockerfile.
demo = [
  "streamlit>=1.41",
  "faiss-cpu>=1.15,<1.16",
  "lightgbm>=4.3",
  "scipy>=1.12",  # the BM25 matrix is scipy.sparse (D-010); explicit, not via lightgbm
  "rank-bm25>=0.2.2",
  "anthropic>=1.0,<2",
]
# Notebooks + plots.
eda = [
  "matplotlib>=3.8",
  "jupyter>=1.0",
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "nbclient>=0.10",
]
dev = [
  "shopsage-rec[eda]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.15",
  "mypy>=2.0",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[project.scripts]
shopsage = "shopsage_rec.cli:app"

[project.urls]
Homepage = "https://github.com/<your-github-handle>/shopsage-recommender"

[tool.hatch.build.targets.wheel]
packages = ["src/shopsage_rec"]

[tool.hatch.build.targets.sdist]
include = ["src/", "configs/", "README.md", "LICENSE"]

[tool.uv]
package = true
# A FAISS build must be chosen explicitly; the demo always runs on CPU.
conflicts = [
  [{ extra = "cpu" }, { extra = "gpu" }],
  [{ extra = "demo" }, { extra = "gpu" }],
]

# On Linux, torch comes from the CUDA 12.6 index so its runtime matches faiss-gpu and works on
# NVIDIA drivers >= 525 (Colab / Kaggle / RunPod T4 hosts). PyPI's default Linux wheel links
# CUDA 13 and needs driver >= 580. Blackwell GPUs (RTX 50xx, B200): switch the URL to .../whl/cu130.
# macOS keeps the PyPI wheel (MPS).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff >= 0.16 also formats Python blocks inside Markdown; docs contain pseudo-code on purpose.
extend-exclude = ["notebooks", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]
"src/shopsage_rec/cli.py" = ["B008"]  # typer.Option(...) defaults are the documented Typer idiom

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "slow: tests that need the real MovieLens-20M download (deselect with -m 'not slow')",
]
filterwarnings = ["error::DeprecationWarning:shopsage_rec.*"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
packages = ["shopsage_rec"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["shopsage_rec"]
branch = true
