# LightGBM re-ranker over Top-500 retrieval candidates. Consumed by `shopsage rank` (Day 6). DRAFT.
# Training data per D-006 (revised 2026-10-18): validation users are split into V_A (retriever model
# selection) and V_B (ranker labels; 10% of V_B held out for early stopping). Label = 1 for the user's
# val item among the retriever's Top-500 (as-of seen items masked); groups whose positive was not
# retrieved are DROPPED and the drop rate (= 1 - V_B HR@500) is logged, never injected. The ranker
# trains on ALL 500 candidates of each group, the distribution it meets at test time. The test split
# is scored once per final config.

run_name: lgbm_ranker
seed: 42                                 # LightGBM seed; 3 seeds on one retriever run (Rule 5)
candidates:
  retriever_run: null                    # run_id of the seed-42 run of B1, the best arm of ablation (a) by mean
                                         # V_A HR@50 over seeds (the seed is pre-declared, not the best seed);
                                         # set on Day 5
  top_k: 500
  val_split_for_labels: V_B
  candidates_per_group: all_500          # fallback if RAM is tight: {top_ranks: 50, random_from_rest: 50} with
                                         # LightGBM row weight 450/50 = 9 on the random rank-51-500 negatives
                                         # (approximate: lambdarank applies row weights after the pairwise lambdas)
  users_for_training: 20000              # cap on V_B users: 20K x 500 = 10M rows ~ 2 GB RAM (design.md §6);
                                         # all ~68K V_B users would be 34M rows

val_partition:                           # the same partition the retriever configs use (D-006)
  seed: 42
  frac_va: 0.5

features:                                # every feature is computed AS OF the user's cutoff (features.asof, Day 2)
  - dot_user_item                        # user_embed · item_embed from the retriever
  - retrieval_rank
  - item_popularity_train                # log count on the TRAIN split only, at both stages (api_spec.md §5.6)
  - item_mean_rating_train               # mean rating on the TRAIN split only, at both stages
  - item_year
  - genre_overlap                        # |genres(item) ∩ top genres(user)| on as-of history
  - genome_similarity                    # cosine between item genome PCA and the user's history mean
  - user_activity
  - user_mean_rating                     # raw ratings strictly before the cutoff (low ratings allowed as features);
                                         # missing-value rule of design.md §7 when none exists
  - days_since_last_interaction          # low priority: most histories span < 1 hour (D-011); "unknown" bucket

lightgbm:
  objective: lambdarank
  metric: ndcg
  eval_at: [10]
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 500
  min_data_in_leaf: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  early_stopping_rounds: 50

eval:
  k_values: [10]
  report: [ndcg@10_end_to_end, hr@10_end_to_end, ndcg@10_retriever_order, hr@500]   # misses count as 0
  bootstrap_samples: 2000                # paired over users against the retriever-order baseline
